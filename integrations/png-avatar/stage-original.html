<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼 · 原版动画</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#20334b;font:16px system-ui,sans-serif}main{max-width:1000px;margin:36px auto;padding:24px}h1{font-size:26px;margin:0 0 8px}.hint{color:#63738a;line-height:1.7}.panel{background:white;border:1px solid #dde5f0;border-radius:18px;padding:24px;margin-top:20px}.stage{min-height:400px;display:grid;place-items:center;background:linear-gradient(135deg,#edf5ff,#e8f6f5);border-radius:12px}iframe{border:0;width:300px;height:360px}#phase{display:inline-block;background:#e8f0ff;color:#2858a3;border-radius:20px;padding:6px 14px;margin-bottom:15px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button,select{border:1px solid #c9d6e6;border-radius:10px;background:white;color:#25476b;padding:10px 16px;font:inherit}button{cursor:pointer}button:hover{background:#eaf2ff}a{color:#285fb3}video{width:100%;border-radius:12px;max-height:540px;background:#172436}.credit{font-size:13px;color:#718197;line-height:1.8}
</style>
<main><h1>大肥鱼 · 原版动画</h1><div class="hint">思考动作跟随 DSH 会话，手动动作结束后恢复。原版播放器首次加载需要一些时间。</div>
<section class="panel"><span id="phase">正在加载</span><div class="stage"><iframe id="player" title="原版角色动画"></iframe></div><div class="controls" id="controls"></div><div class="controls"><select id="more" aria-label="其他原版动作"></select><button id="play-more">播放所选动作</button></div><p class="hint" id="message">正在读取角色状态…</p></section>
<section class="panel" id="recording" hidden><h2>动作演示视频</h2><video controls preload="metadata" id="video"></video></section>
<p class="credit">作者：YunYueSama · <a href="https://github.com/YunYueSama/codex-deepseek-pet">原项目</a><br>保留原版动画、运动场插值与动作时序。第三方角色参考权利遵守原项目说明。</p></main>
<script>
const base=location.pathname.replace(/\/?$/,'/');
const labels={idle:'待机',thinking:'思考中',working:'执行工具',replying:'回复中',error:'异常',manual:'手动动作',wave:'挥手',happy:'开心',sad:'难过',surprised:'惊讶','walk-left':'向左走','walk-right':'向右走',think:'思考',proud:'得意',hungry:'饿了',eat:'吃东西',protest:'抗议',sleep:'入睡',left:'向左走',right:'向右走',surprise:'惊讶',jump:'跳跃',peek:'探头',dance:'跳舞',stretch:'伸懒腰',sneak:'偷吃',satisfied:'满足',review:'审视',shock:'震惊',pout:'鼓腮',sorry:'歉意',hum:'哼歌',curl:'蜷起','meal-break':'吃饭','token-game':'token 小游戏','tail-sway':'摆尾',wake:'醒来',shift:'换重心',settle:'安定',breathe:'呼吸',drag:'拎起',fall:'下落',land:'落地','stop-left':'向左收步','stop-right':'向右收步','story-recover':'剧情收尾'};
let manifest,state,ready=false;
setInterval(()=>{const player=document.querySelector('#player');try{const d=player.contentWindow.__originalDiagnostics;if(d?.assetsReady&&!d.flowReady){player.hidden=true;document.querySelector('#phase').textContent='当前浏览器无法启用完整动画';document.querySelector('#message').textContent='请使用支持 WebGL 2 的浏览器。';}}catch{}},1000);
async function play(action){const r=await fetch(base+'api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,ttl:action==='thinking'?12:8,source:'manual',phase:'manual'})});if(!r.ok)throw Error('动作未能启动');await refresh()}
async function refresh(){try{const r=await fetch(base+'api/state',{cache:'no-store'});if(!r.ok)throw Error();state=await r.json();document.querySelector('#phase').textContent=labels[state.phase]||labels[state.action]||state.action;document.querySelector('#message').textContent=state.source==='auto'?'正在跟随 agent 的会话状态。':state.source==='manual'?'手动动作播放中，结束后恢复自动状态。':'等待 agent 开始工作。';}catch{document.querySelector('#phase').textContent='连接暂不可用'}}
(async()=>{manifest=await(await fetch(base+'manifest.json')).json();if(manifest.renderer!=='original')throw Error();document.querySelector('#player').src=base+'original/src/renderer/dsh-player.html';for(const action of ['idle','thinking','wave','happy','sad','surprised','walk-left','walk-right']){const b=document.createElement('button');b.textContent=labels[action];b.onclick=()=>play(action).catch(()=>{});document.querySelector('#controls').append(b)}for(const action of manifest.nativeActions){const option=document.createElement('option');option.value=action;option.textContent=labels[action]||action;document.querySelector('#more').append(option)}document.querySelector('#play-more').onclick=()=>play(document.querySelector('#more').value).catch(()=>{});ready=true;await refresh();setInterval(()=>{if(!document.hidden)refresh()},500);const v=await fetch(base+'preview.mp4',{method:'HEAD'});if(v.ok){document.querySelector('#recording').hidden=false;document.querySelector('#video').src=base+'preview.mp4'}})().catch(()=>{document.querySelector('#phase').textContent='角色加载失败'});
</script></html>
