<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼 · 2D 直播角色</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#20334b;font:16px system-ui,sans-serif}main{max-width:1000px;margin:36px auto;padding:24px}h1{font-size:26px;margin:0 0 8px}.hint{color:#63738a;line-height:1.7}.panel{background:white;border:1px solid #dde5f0;border-radius:18px;padding:24px;margin-top:20px}.stage{min-height:370px;display:grid;place-items:center;background:linear-gradient(135deg,#edf5ff,#e8f6f5);border-radius:12px}canvas{width:320px;height:320px}#phase{display:inline-block;background:#e8f0ff;color:#2858a3;border-radius:20px;padding:6px 14px;margin-bottom:15px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button{border:1px solid #c9d6e6;border-radius:10px;background:white;color:#25476b;padding:10px 16px;font:inherit;cursor:pointer}button:hover{background:#eaf2ff}a{color:#285fb3}video{width:100%;border-radius:12px;max-height:540px;background:#172436}.credit{font-size:13px;color:#718197;line-height:1.8}
</style>
<main><h1>大肥鱼 · 2D 直播角色</h1><div class="hint">思考动作跟随 DSH 真实会话状态。手动表情会短暂覆盖自动动作。</div>
<section class="panel"><span id="phase">连接中</span><div class="stage"><canvas id="avatar" width="320" height="320"></canvas></div><div class="controls" id="controls"></div><p class="hint" id="message">正在读取角色状态…</p></section>
<section class="panel" id="recording" hidden><h2>桌面叠加验收录像</h2><p class="hint">这段是内网验收录像，未向直播平台推送。</p><video controls preload="metadata" id="video"></video></section>
<p class="credit">作者：YunYueSama · <a href="https://github.com/YunYueSama/codex-deepseek-pet">原素材仓库</a><br>适配：提取并缩小整身动画帧，按会话事件切换动作。第三方角色参考权利遵守原仓库说明。</p></main>
<script>
const base=location.pathname.replace(/\/?$/,'/'),canvas=document.querySelector('#avatar'),ctx=canvas.getContext('2d');
const labels={idle:'待机',thinking:'思考中',working:'执行工具',replying:'回复中',error:'异常',manual:'手动表情',wave:'挥手',happy:'开心',sad:'难过',surprised:'惊讶','walk-left':'向左走','walk-right':'向右走'};
let manifest,state={action:'idle',startedAt:0},images={},ready=false,lastFrame='',lastTime=0;
async function refresh(){try{const r=await fetch(base+'api/state',{cache:'no-store'});if(!r.ok)throw Error('服务暂不可用');state=await r.json();document.querySelector('#phase').textContent=labels[state.phase]||labels[state.action];document.querySelector('#message').textContent=state.source==='auto'?'正在跟随 agent 的会话事件；页面不会显示思考文本。':state.source==='manual'?'手动动作播放中，结束后恢复自动状态。':'等待 agent 开始工作。';}catch(e){document.querySelector('#phase').textContent='连接暂不可用';}}
function paint(now){requestAnimationFrame(paint);if(!ready||document.hidden||now-lastTime<1000/12)return;lastTime=now;const c=manifest.actions[state.action]||manifest.actions.idle,total=c.times.reduce((a,b)=>a+b,0);let t=Math.max(0,Date.now()-state.startedAt),i=0;if(c.loop)t%=total;else if(t>=total){const n=manifest.actions.idle.files[0];if(lastFrame!==n){ctx.clearRect(0,0,320,320);ctx.drawImage(images[n],0,0,320,320);lastFrame=n}return}while(i<c.times.length-1&&t>=c.times[i]){t-=c.times[i];i++}const n=c.files[i];if(lastFrame!==n){ctx.clearRect(0,0,320,320);ctx.drawImage(images[n],0,0,320,320);lastFrame=n}}
(async()=>{const r=await fetch(base+'manifest.json');if(!r.ok)throw Error('素材读取失败');manifest=await r.json();await Promise.all([...new Set(Object.values(manifest.actions).flatMap(x=>x.files))].map(n=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{images[n]=img;resolve()};img.onerror=reject;img.src=base+'assets/'+n+'?v='+manifest.commit})));for(const action of Object.keys(manifest.actions)){const b=document.createElement('button');b.textContent=labels[action];b.onclick=async()=>{await fetch(base+'api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,ttl:action==='thinking'?8:3,source:'manual',phase:'manual'})});await refresh()};document.querySelector('#controls').append(b)}ready=true;await refresh();setInterval(()=>{if(!document.hidden)refresh()},500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});const v=await fetch(base+'preview.mp4',{method:'HEAD'});if(v.ok){document.querySelector('#recording').hidden=false;document.querySelector('#video').src=base+'preview.mp4'}})().catch(()=>{document.querySelector('#phase').textContent='角色加载失败'});
requestAnimationFrame(paint);
</script></html>
