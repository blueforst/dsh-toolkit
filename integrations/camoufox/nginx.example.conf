# 放在 Nginx http 配置层；替换域名、证书与宿主端口后使用。
map $http_upgrade $dsh_toolkit_connection {
    default upgrade;
    '' close;
}
# 不记录查询参数，防止认证参数进入访问日志。
log_format dsh_toolkit '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 443 ssl;
    server_name dsh.example.com;
    ssl_certificate /etc/letsencrypt/live/dsh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh.example.com/privkey.pem;
    auth_basic "DSH";
    auth_basic_user_file /etc/nginx/dsh-toolkit.htpasswd;
    include /etc/nginx/snippets/dsh-toolkit-bootstrap.conf;
    access_log /var/log/nginx/dsh-toolkit-access.log dsh_toolkit;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dsh_toolkit_connection;
    proxy_read_timeout 3600s;
    # 公网先经过 Basic 登录，根页再携带原生 bootstrap token。
    location = / {
        proxy_pass http://127.0.0.1:3080/?token=$dsh_bootstrap_token&$args;
    }
    location ^~ /novnc-debian-1.6.0-2/ {
        proxy_pass http://127.0.0.1:6080/;
    }
    location / {
        proxy_pass http://127.0.0.1:3080;
    }
}
